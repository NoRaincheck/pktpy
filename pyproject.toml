[build-system]
requires = ["scikit-build-core>=0.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pktpy"
version = "0.1.0"
description = "Portable Python 3.x interpreter — pocketpy packaged for PyPI"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "pktpy contributors", email = "crn@anomaly.rocks" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
pktpy = "pktpy.cli:main"

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8"]

[tool.scikit-build]
wheel.py-api = "cp39"
wheel.packages = ["pktpy"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]

[tool.ruff]
src = ["pktpy", "tests"]
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
